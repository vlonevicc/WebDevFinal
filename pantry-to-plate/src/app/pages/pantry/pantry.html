<div class="px-8 py-10 max-w-7xl mx-auto space-y-12">
  <!--  HEADER -->
  <div class="flex justify-between items-center">
    <h1 class="text-4xl font-headline text-[#4f6144]">Pantry</h1>
  </div>

  <!--  STATS -->
  <div class="grid md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-sm text-gray-500">Low Stock</p>
      <h3 class="text-3xl text-yellow-600">{{ lowStockItems.length }} items</h3>
      <button routerLink="/grocery" class="text-sm text-[#4f6144] mt-2">Review Grocery →</button>
    </div>

    <div class="bg-[#4f6144] text-white p-6 rounded-xl text-center">
      <h3 class="text-xl mb-2">Add to Pantry</h3>
      <input #nameInput placeholder="Item name" class="border p-2 mr-2 text-black" />
      <input #qtyInput type="number" placeholder="Qty" class="border p-2 mr-2 text-black" />

      <button
        (click)="addItem(nameInput.value, +qtyInput.value)"
        class="bg-[#4f6144] text-white px-4 py-2 rounded"
      >
        Add
      </button>
    </div>
  </div>

    <!-- EMPTY STATE -->
  <div *ngIf="pantryItems.length === 0" class="text-center py-16">

    <h2 class="text-2xl font-headline text-[#4f6144]">
      Your pantry is empty
    </h2>

    <p class="text-gray-500 mt-2">
      Add items or sync from your grocery list to get started.
    </p>

    <button 
      routerLink="/grocery"
      class="mt-6 bg-[#4f6144] text-white px-6 py-3 rounded-full hover:bg-[#3e4f36] transition">
      Go to Grocery →
    </button>

  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <div
      *ngFor="let item of pantryItems"
      class="bg-white p-5 rounded-xl flex items-center gap-4 shadow"
    >
      <div class="flex-grow">
        <h4 class="font-semibold">{{ item.name }}</h4>

        <p
          class="text-sm"
          [ngClass]="item.quantity <= item.threshold ? 'text-red-500' : 'text-gray-500'"
        >
          {{ item.quantity }} left
        </p>
      </div>

      <button (click)="deleteItem(item._id)" class="text-red-500 text-sm">Delete</button>
    </div>
  </div>
</div>
